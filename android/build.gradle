buildscript {
  ext.CarrotQuest = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    // Carrot publishes one artifact per region flavour: `commonRelease` for the
    // default servers, `usRelease` for the US ones. Override from your app's
    // android/build.gradle:
    //   ext { carrotSdkVersion = "3.4.2-usRelease" }
    //
    // Must stay on the 3.x line — 2.x has a callback-free `setup`, a `setDebug`
    // toggle and JSON-string event params, none of which this bridge uses.
    carrotSdkVersion: "3.4.2-commonRelease"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return CarrotQuest[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: '../nitrogen/generated/android/carrotquest+autolinking.gradle'

apply plugin: "com.facebook.react"

android {
  namespace "com.margelo.nitro.carrotquest"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
  // Carrot quest publishes its Android SDK from a GitHub-hosted Maven repo
  // rather than Maven Central.
  maven { url "https://raw.github.com/carrotquest/android-sdk/carrotquest" }
  // Required for the SDK's own transitive GitHub dependencies — 3.x pulls
  // com.github.Redman1037:TSnackBar and com.github.chrisbanes:PhotoView.
  maven { url "https://jitpack.io" }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")

  // `api`, not `implementation`, so consumers can call CarrotQuestSetup from
  // their own Application class. Pinned exactly — the vendor publishes a single
  // artifact per release with no semver guarantees. Bump deliberately.
  api "io.carrotquest:android-sdk:${getExtOrDefault('carrotSdkVersion')}"
}
