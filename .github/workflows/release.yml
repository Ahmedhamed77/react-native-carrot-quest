name: Release

# Pushing a `v*` tag (created by `yarn release`) publishes that version to npm
# and opens a GitHub Release. Publishing uses npm trusted publishing (OIDC), so
# there is no long-lived NPM_TOKEN to leak or rotate.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # Only releases cut from main may ship.
      - name: Ensure tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from main."
            exit 1
          fi

      - name: Ensure tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION."
            exit 1
          fi

      - name: Lint files
        run: yarn lint

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Typecheck files
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

      # Carrot does not officially support React Native: refuse to publish a
      # bridge whose pinned Android SDK no longer exposes what it calls. iOS is
      # verified in build-ios on every push to main (it needs the installed pod).
      - name: Verify Android SDK surface
        run: yarn verify:native --android --strict

      - name: Build package
        run: yarn prepare

      # Trusted publishing needs npm >= 11.5.1. The Node version in .nvmrc ships
      # a new enough npm, so do not `npm install -g npm@latest`: the newest npm
      # requires a newer Node than .nvmrc pins and fails with EBADENGINE.
      - name: Publish to npm
        run: |
          npm --version
          npx --yes semver -r '>=11.5.1' "$(npm --version)" >/dev/null || {
            echo "::error::npm $(npm --version) is too old for trusted publishing (needs >= 11.5.1). Bump .nvmrc."
            exit 1
          }
          npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Use the section of CHANGELOG.md that `yarn release` just wrote.
          awk -v v="$VERSION" '
            /^#+ \[?[0-9]/ { if (found) exit; if (index($0, v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ -s release-notes.md ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
